name: Refresh PSX data (cloud)
on:
  # Manually test a fresh data collection before enabling automated schedules.
  workflow_dispatch:
  schedule:
    - cron: '43 12 * * 1-5'  # 17:43 PKT, Monday-Friday, after market close
permissions:
  contents: write
concurrency:
  group: psx-refresh
  cancel-in-progress: false
jobs:
  daily:
    # Repository variable PSX_ENABLE_SCHEDULED_REFRESH must be 'true' for scheduled runs.
    if: github.event_name == 'workflow_dispatch' || vars.PSX_ENABLE_SCHEDULED_REFRESH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium (may be blocked by source providers)
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Collect data and recompute engine using fixed alerts
        run: python monitor/refresh_daily.py --headless --fixed-alerts
      - name: Reject partial or stale source data
        run: python cloud/verify_freshness.py
      - name: Commit only a verified fresh snapshot
        run: |
          git config user.name 'psx-refresh-bot'
          git config user.email 'psx-refresh-bot@users.noreply.github.com'
          git add data/current dashboard/data.js dashboard/standalone.html dashboard/psx-screener-single-file.html workdir reports
          if ! git diff --cached --quiet; then
            git commit -m 'Update PSX screener snapshot after fresh data verification'
            git push
          fi
