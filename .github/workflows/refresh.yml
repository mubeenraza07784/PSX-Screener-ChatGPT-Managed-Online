name: Refresh PSX data (approved import)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Check saved engine, or import a complete authorized feature snapshot?"
        required: true
        type: choice
        default: validate_only
        options:
          - validate_only
          - import_approved

# No scheduled scraping: the former Playwright/StockAnalysis cloud job
# received a bot verification challenge in GitHub-hosted browsers.
# Add a licensed provider adapter and test freshness before scheduling updates.
permissions:
  contents: write
concurrency:
  group: psx-refresh
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate original calculation engine (historical data ONLY)
        if: github.event.inputs.mode == 'validate_only'
        run: |
          python -m compileall -q engine monitor cloud dashboard streamlit_app.py
          python monitor/refresh_daily.py --skip-collect --fixed-alerts
          echo 'VALIDATION COMPLETE: original saved snapshot, NOT fresh trading data. Nothing is published.'
      - name: Import permitted source and recompute the complete screener
        if: github.event.inputs.mode == 'import_approved'
        run: python cloud/import_approved.py
      - name: Publish only after import AND same-day freshness gate passed
        if: github.event.inputs.mode == 'import_approved'
        run: |
          git config user.name 'psx-refresh-bot'
          git config user.email 'psx-refresh-bot@users.noreply.github.com'
          git add data/current dashboard/data.js dashboard/standalone.html dashboard/psx-screener-single-file.html workdir reports
          if ! git diff --cached --quiet; then
            git commit -m 'Publish PSX snapshot from authorized input'
            git push
          fi
